    <script>
        const AD_URL = "https://www.profitablecpmratenetwork.com/ukxua19f69?key=04cd91b4e6df592f70c4c4f22764a8ef";
        
        // OBJEK UNTUK MENCATAT APAKAH TOMBOL SUDAH DIKLIK IKLANNYA
        let adStatus = {
            apiInput: false,
            upload: false,
            generate: false
        };

        function triggerAd() {
            window.open(AD_URL, '_blank');
        }

        const apiKeyInput = document.getElementById('apiKey');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');

        // 1. LOGIC INPUT API (Klik pertama iklan, kedua bisa ngetik)
        apiKeyInput.addEventListener('mousedown', function(e) {
            if (!adStatus.apiInput) {
                e.preventDefault();
                triggerAd();
                adStatus.apiInput = true;
                showToast("Akses Input Terbuka!");
            }
        });

        // 2. LOGIC UPLOAD (Klik pertama iklan, kedua buka folder)
        dropZone.addEventListener('click', function(e) {
            if (!adStatus.upload) {
                triggerAd();
                adStatus.upload = true;
                showToast("Akses Upload Terbuka!");
            } else {
                fileInput.click();
            }
        });

        // 3. LOGIC GENERATE (Klik pertama iklan, kedua proses)
        generateBtn.addEventListener('click', function() {
            if (!adStatus.generate) {
                triggerAd();
                adStatus.generate = true;
                showToast("Satu langkah lagi! Klik tombol Generate sekali lagi.");
            } else {
                alert("Memproses AI Prompt... (Ganti bagian ini dengan fungsi AI kamu)");
                // Masukkan fungsi generate asli kamu di sini
            }
        });

        // Tampilan Preview Gambar (Setelah upload terbuka)
        fileInput.addEventListener('change', (e) => {
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            Array.from(e.target.files).forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.style.width = '60px'; img.style.height = '60px'; img.style.borderRadius = '8px';
                img.style.objectFit = 'cover';
                previewContainer.appendChild(img);
            });
        });

        // Theme Toggle
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            themeBtn.innerText = theme === 'dark' ? '🌙' : '☀️';
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    </script>
