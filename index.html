<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK Prompt Generator - AI Pro 2026</title>
    
    <script src="https://pl28737230.profitablecpmratenetwork.com/e9/cf/f3/e9cff37aea52e2a72b500e67263f68f4.js"></script>

    <style>
        :root {
            --primary: #8e44ad;
            --primary-light: #a29bfe;
            --bg-color: #0b0b0e;
            --card-bg: rgba(30, 30, 36, 0.7);
            --text-color: #f5f5f5;
            --text-muted: #b2bec3;
            --border-color: #2d2d35;
            --success: #2ecc71;
            --error: #e74c3c;
            --gold: #f1c40f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header { margin-bottom: 30px; text-align: center; width: 100%; }
        .zk-logo { width: 160px; filter: drop-shadow(0 0 15px var(--primary)); margin-bottom: 10px; }
        h1 { font-size: 1.6rem; background: linear-gradient(to right, #fff, var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { width: 100%; max-width: 700px; }
        .glass-card { 
            background: var(--card-bg); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted); }
        
        .input-wrapper { position: relative; display: flex; gap: 10px; align-items: center; }
        input, select {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 12px; border-radius: 10px; outline: none;
        }

        .toggle-password {
            position: absolute; right: 85px; cursor: pointer; color: var(--text-muted);
            font-size: 1.2rem; user-select: none;
        }

        .btn-test { 
            background: var(--primary); color: white; border: none; 
            padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold;
            min-width: 70px;
        }

        .status-msg { font-size: 0.75rem; margin-top: 5px; display: none; font-weight: bold; }

        .upload-zone {
            border: 2px dashed var(--primary); padding: 40px; text-align: center;
            border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .upload-zone:hover { background: rgba(142, 68, 173, 0.1); }

        .btn-generate {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, var(--primary), #6c5ce7);
            color: white; font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }

        .result-item {
            background: #16161a; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 15px; margin-top: 20px;
        }
        textarea {
            width: 100%; height: 120px; background: #000; color: #2ecc71;
            border: none; padding: 10px; border-radius: 8px; font-family: monospace;
            font-size: 0.85rem; margin: 10px 0; resize: none;
        }

        .toast {
            position: fixed; bottom: 20px; background: #333; color: #fff;
            padding: 12px 25px; border-radius: 50px; z-index: 9999; display: none;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://z-cdn-media.chatglm.cn/files/c6291519-8ab0-465d-8f7a-c80a0b04978f.png?auth_key=1870807375-f619d5a796344a9589b79c05247ab733-0-f8780a7acf836353d0979f6197b8e96f" alt="ZK Logo" class="zk-logo">
        <h1>ZK PROMPT MASTER AI</h1>
    </header>

    <div class="container">
        <div class="glass-card">
            <div class="form-group">
                <label>Google Gemini API Key</label>
                <div class="input-wrapper">
                    <input type="password" id="apiKey" placeholder="Tempel API Key anda...">
                    <span class="toggle-password" id="toggleApi">👁️</span>
                    <button class="btn-test" id="testBtn">CEK</button>
                </div>
                <div id="apiStatus" class="status-msg"></div>
            </div>

            <div class="form-group">
                <label>Pilih Versi AI</label>
                <select id="modelSelect">
                    <option value="gemini-2.0-flash">Flash 2.0 (Tercepat)</option>
                    <option value="gemini-1.5-pro">Pro 1.5 (Paling Detail)</option>
                </select>
            </div>
        </div>

        <div class="glass-card upload-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
            <div id="uploadContent">
                <span style="font-size: 2rem;">📸</span>
                <p style="font-weight: bold; margin-top: 10px;">Upload Gambar Microstock</p>
            </div>
            <div id="previewContainer" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; justify-content:center;"></div>
        </div>

        <button class="btn-generate" id="generateBtn">✨ GENERATE PROMPT & KEYWORDS</button>

        <div id="resultsList"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://pl28434722.profitablecpmratenetwork.com/63/63/4a/63634a8d6f875d2f105652f4ca71e9e1.js"></script>
    <script async="async" data-cfasync="false" src="https://pl28802753.profitablecpmratenetwork.com/6def9d7ddb10b55e224d652e45458248/invoke.js"></script>

    <script>
        const AD_URL = "https://www.profitablecpmratenetwork.com/ukxua19f69?key=04cd91b4e6df592f70c4c4f22764a8ef";
        
        let adFlags = { api: false, upload: false, gen: false };

        function triggerAd() {
            window.open(AD_URL, '_blank');
        }

        const apiKeyInput = document.getElementById('apiKey');
        const toggleApi = document.getElementById('toggleApi');
        const testBtn = document.getElementById('testBtn');
        const apiStatus = document.getElementById('apiStatus');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultsList = document.getElementById('resultsList');

        // 1. SHOW/HIDE API KEY
        toggleApi.addEventListener('click', () => {
            const type = apiKeyInput.getAttribute('type') === 'password' ? 'text' : 'password';
            apiKeyInput.setAttribute('type', type);
            toggleApi.innerText = type === 'password' ? '👁️' : '🕶️';
        });

        // 2. CEK API STATUS + IKLAN
        testBtn.addEventListener('click', async () => {
            if (!adFlags.api) {
                triggerAd();
                adFlags.api = true;
                return;
            }

            const key = apiKeyInput.value;
            if (!key) return alert("Masukkan API Key!");

            apiStatus.style.display = "block";
            apiStatus.style.color = "var(--text-muted)";
            apiStatus.innerText = "⏳ Sedang mengecek...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                if (response.ok) {
                    apiStatus.style.color = "var(--success)";
                    apiStatus.innerText = "✅ API Key Valid! Siap digunakan.";
                } else {
                    throw new Error();
                }
            } catch (err) {
                apiStatus.style.color = "var(--error)";
                apiStatus.innerText = "❌ API Key Salah atau Tidak Aktif!";
            }
        });

        // 3. UPLOAD LOGIC + IKLAN
        dropZone.addEventListener('click', () => {
            if (!adFlags.upload) {
                triggerAd();
                adFlags.upload = true;
                return;
            }
            fileInput.click();
        });

        // 4. GENERATE LOGIC + IKLAN
        generateBtn.addEventListener('click', async () => {
            if (!adFlags.gen) {
                triggerAd();
                adFlags.gen = true;
                showToast("Satu langkah lagi! Klik Generate sekali lagi.");
                return;
            }

            const key = apiKeyInput.value;
            const files = fileInput.files;

            if (!key || files.length === 0) {
                alert("Lengkapi API Key dan Upload Gambar!");
                return;
            }

            generateBtn.innerText = "⏳ AI sedang bekerja...";
            generateBtn.disabled = true;
            resultsList.innerHTML = "";

            for (const file of files) {
                try {
                    const base64 = await fileToBase64(file);
                    const prompt = "Act as a Microstock Expert. Analyze this image and provide: 1. Title (max 10 words), 2. Description, 3. 50 Keywords separated by commas. Language: English.";
                    const result = await callGemini(key, base64, file.type, prompt);
                    renderResult(file.name, result);
                } catch (e) {
                    alert("Gagal memproses: " + file.name);
                }
            }

            generateBtn.innerText = "✨ GENERATE PROMPT & KEYWORDS";
            generateBtn.disabled = false;
        });

        // FUNGSI INTI AI
        async function callGemini(key, base64, mimeType, prompt) {
            const model = document.getElementById('modelSelect').value;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
            
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: mimeType, data: base64.split(',')[1] } }] }]
                })
            });
            const data = await resp.json();
            return data.candidates[0].content.parts[0].text;
        }

        function fileToBase64(file) {
            return new Promise((r, j) => {
                const f = new FileReader();
                f.readAsDataURL(file);
                f.onload = () => r(f.result);
                f.onerror = e => j(e);
            });
        }

        function renderResult(name, text) {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <small style="color:var(--primary-light)">File: ${name}</small>
                <textarea id="txt_${name}" readonly>${text}</textarea>
                <button class="btn-test" style="width:100%" onclick="copyMe('txt_${name}', this)">Salin Hasil</button>
            `;
            resultsList.appendChild(div);
        }

        window.copyMe = (id, btn) => {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            btn.innerText = "✅ Tersalin!";
            setTimeout(() => btn.innerText = "Salin Hasil", 2000);
        }

        fileInput.addEventListener('change', (e) => {
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            Array.from(e.target.files).forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.style.width = '50px'; img.style.height = '50px'; img.style.borderRadius = '5px'; img.style.objectFit = 'cover';
                previewContainer.appendChild(img);
            });
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
